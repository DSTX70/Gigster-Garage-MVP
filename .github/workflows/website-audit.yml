name: Website Audit (Lighthouse + a11y)

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: website-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify AUDIT_BASE_URL secret
        env:
          AUDIT_BASE_URL: ${{ secrets.AUDIT_BASE_URL }}
        run: |
          if [ -z "${AUDIT_BASE_URL}" ]; then
            echo "ERROR: Missing GitHub Actions secret AUDIT_BASE_URL"
            echo "Set it under: Repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "AUDIT_BASE_URL is set: ${AUDIT_BASE_URL}"

      - name: Lighthouse CI (uses .lighthouserc.json for assertions)
        env:
          AUDIT_BASE_URL: ${{ secrets.AUDIT_BASE_URL }}
        run: |
          echo "Running Lighthouse CI against: ${AUDIT_BASE_URL}"
          npx -y @lhci/cli autorun \
            --config=.lighthouserc.json \
            --collect.url="${AUDIT_BASE_URL}" \
            --collect.numberOfRuns=3 \
            --upload.target=temporary-public-storage

      - name: Pa11y CI (WCAG2AA)
        env:
          AUDIT_BASE_URL: ${{ secrets.AUDIT_BASE_URL }}
        run: |
          echo "Running Pa11y CI against: ${AUDIT_BASE_URL}"
          npx -y pa11y-ci "${AUDIT_BASE_URL}" --config .pa11yci.json

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci-artifacts
          path: .lighthouseci
          if-no-files-found: ignore
